[package]
name = "toxic_brainz_server"
version = "0.1.0"
edition = "2024"

[dev-dependencies]
tb_client = { path = "./crates/tb_client" }

[dependencies]
uuid = { version = "1.15.0", features = ["v4"] }
axum = { version = "0.8.0", features = ["multipart"] }
tokio = { version = "1.40.0", features = ["full"] }
serde = { version = "1.0.213", features = ["derive"] }
serde_json = "1.0.131"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
log = "0.4.22"
env_logger = "0.11.6"
chrono = "0.4.31"
dotenv = "0.15.0"
jsonwebtoken = { version = "10.4.0", features = ["rust_crypto"] }
rust_decimal = "1.34.0"
server_types = { path = "./crates/server_types" }
sea-orm = { version = "2.0.0-rc.38", features = [
    "sqlx-sqlite",
    "runtime-tokio",
] }
bcrypt = "0.17"
argon2 = "0.4.1"
tower-http = { version = "0.6.10", features = ["trace", "cors"] }
anyhow = "1.0.102"
regex = "1.12.3"
rand = "0.10.1"
getrandom = "0.4.2"
migration = { path = "migration" }
config = "0.15"
serde_with = "3.20.0"
duration-str = "0.21.0"
zip = "8.6.0"
sanitize-filename = "0.6.0"
quick-xml = "0.40.1"
